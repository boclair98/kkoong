spring.application.name=three-letter-boom
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript,text/plain,image/svg+xml
server.forward-headers-strategy=framework
spring.web.resources.cache.cachecontrol.max-age=7d
spring.web.resources.cache.cachecontrol.cache-public=true
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=세글자쿵!
info.app.description=모두가 바로 모여 즐기는 오리지널 실시간 한글 리듬 게임
info.app.version=@project.version@
